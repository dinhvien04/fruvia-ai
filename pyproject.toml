[project]
name = "fruvia-ai"
version = "0.1.0"
description = "AI-powered fruit recognition and image retrieval system using DINOv2 and Qdrant Cloud"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.27.0,<1.0.0",
    "pydantic>=2.5.0,<3.0.0",
    "pydantic-settings>=2.1.0,<3.0.0",
    "python-multipart>=0.0.32,<0.1.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "Pillow>=12.3.0,<13.0.0",
    "transformers>=5.5.0,<6.0.0",
    "qdrant-client>=1.7.0,<2.0.0",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",
    "ruff>=0.2.0",
    "pip-audit>=2.8.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (may need model/qdrant)",
    "slow: Slow tests (model loading, etc.)",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
