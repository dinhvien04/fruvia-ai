<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi tiết loài | Fruvia AI</title>
  <meta name="description" content="Thông tin chuẩn hóa và danh mục loài trái cây trong hệ thống Fruvia AI.">
  <meta name="robots" content="index,follow">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#059669">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/explore.css">
</head>
<body>
  <!-- Header Navbar -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="brand-logo" aria-label="Fruvia AI - Trang chủ">
        <img src="assets/svg/brand-lockup.svg" alt="Fruvia AI Logo" width="160" height="32">
      </a>

      <nav class="main-nav" aria-label="Điều hướng chính">
        <a href="/" class="nav-link">Trang chủ</a>
        <a href="/search" class="nav-link">Tìm bằng ảnh</a>
        <a href="/explore" class="nav-link active">Khám phá</a>
      </nav>

      <div class="header-actions">
        <a href="/explore" class="btn btn-secondary btn-sm">Quay lại danh mục</a>
      </div>
    </div>
  </header>

  <main class="container main-content species-detail-main">
    <div id="species-detail-container" class="container-narrow species-detail-container">
      <!-- Dynamic populated -->
      <div class="card empty-state">
        <span class="spinner" style="margin: 0 auto 16px;"></span>
        <p>Đang tải thông tin loài và dữ liệu tri thức...</p>
      </div>
    </div>
  </main>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="mobile-bottom-nav" aria-label="Điều hướng di động">
    <a href="/" class="mobile-nav-item">
      <img src="assets/svg/nav-home.svg" alt="" class="mobile-nav-icon" width="20" height="20" aria-hidden="true">
      <span>Trang chủ</span>
    </a>
    <a href="/search" class="mobile-nav-item">
      <img src="assets/svg/nav-search.svg" alt="" class="mobile-nav-icon" width="20" height="20" aria-hidden="true">
      <span>Tìm kiếm</span>
    </a>
    <a href="/explore" class="mobile-nav-item active" aria-current="page">
      <img src="assets/svg/nav-explore.svg" alt="" class="mobile-nav-icon" width="20" height="20" aria-hidden="true">
      <span>Khám phá</span>
    </a>
  </nav>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <p>© 2026 Fruvia AI. Bảo lưu mọi quyền.</p>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/species.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
