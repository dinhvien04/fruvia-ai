<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" fill="none" width="100%" height="100%" aria-hidden="true">
  <!-- Background Container -->
  <rect width="600" height="320" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Flow Track Line -->
  <path d="M 120 160 L 480 160" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Step 1: Input Fruit Image -->
  <g transform="translate(40, 100)">
    <rect width="110" height="120" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="15" y="15" width="80" height="65" rx="6" fill="#F1F5F9"/>
    <!-- Simplified Fruit Shape inside photo -->
    <circle cx="55" cy="48" r="20" fill="#059669" opacity="0.85"/>
    <path d="M55 28C55 28 57.5 23 62 24.5C61 28.5 55 28 55 28Z" fill="#047857"/>
    <text x="55" y="98" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Input Image</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 160 160 L 185 160" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
  <path d="M 180 155 L 187 160 L 180 165" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 2: DINOv2 Model -->
  <g transform="translate(195, 90)">
    <rect width="130" height="140" rx="12" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
    <rect x="15" y="15" width="100" height="75" rx="8" fill="#FFFFFF" stroke="#D1FAE5" stroke-width="1"/>
    <!-- Deep Learning Neural Net Representation -->
    <circle cx="35" cy="35" r="4" fill="#059669"/>
    <circle cx="35" cy="52" r="4" fill="#059669"/>
    <circle cx="35" cy="70" r="4" fill="#059669"/>
    <circle cx="65" cy="42" r="4" fill="#10B981"/>
    <circle cx="65" cy="62" r="4" fill="#10B981"/>
    <circle cx="95" cy="52" r="4" fill="#047857"/>
    <!-- Connections -->
    <line x1="39" y1="35" x2="61" y2="42" stroke="#A7F3D0" stroke-width="1.2"/>
    <line x1="39" y1="52" x2="61" y2="42" stroke="#A7F3D0" stroke-width="1.2"/>
    <line x1="39" y1="52" x2="61" y2="62" stroke="#A7F3D0" stroke-width="1.2"/>
    <line x1="39" y1="70" x2="61" y2="62" stroke="#A7F3D0" stroke-width="1.2"/>
    <line x1="69" y1="42" x2="91" y2="52" stroke="#A7F3D0" stroke-width="1.2"/>
    <line x1="69" y1="62" x2="91" y2="52" stroke="#A7F3D0" stroke-width="1.2"/>
    <text x="65" y="108" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#064E3B" text-anchor="middle">DINOv2</text>
    <text x="65" y="124" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#047857" text-anchor="middle">Vision Transformer</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 335 160 L 360 160" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
  <path d="M 355 155 L 362 160 L 355 165" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 3: 768D Vector -->
  <g transform="translate(370, 105)">
    <rect width="80" height="110" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="12" y="14" width="56" height="58" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <!-- Vector Math Representation -->
    <text x="40" y="32" font-family="ui-monospace, monospace" font-size="9" fill="#475569" text-anchor="middle">[0.042,</text>
    <text x="40" y="46" font-family="ui-monospace, monospace" font-size="9" fill="#475569" text-anchor="middle">-0.185,</text>
    <text x="40" y="60" font-family="ui-monospace, monospace" font-size="9" fill="#475569" text-anchor="middle">... 768d]</text>
    <text x="40" y="90" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">768D Vector</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 460 160 L 485 160" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
  <path d="M 480 155 L 487 160 L 480 165" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 4: Qdrant Search -->
  <g transform="translate(495, 95)">
    <rect width="75" height="130" rx="12" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
    <!-- Qdrant Cylinder/Vector DB Icon -->
    <path d="M 17 30 C 17 22, 58 22, 58 30 C 58 38, 17 38, 17 30 Z" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <path d="M 17 30 L 17 65 C 17 73, 58 73, 58 65 L 58 30" fill="none" stroke="#059669" stroke-width="1.5"/>
    <path d="M 17 48 C 17 56, 58 56, 58 48" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="2 2"/>
    <!-- Node points inside DB -->
    <circle cx="30" cy="40" r="2.5" fill="#047857"/>
    <circle cx="45" cy="45" r="2.5" fill="#10B981"/>
    <circle cx="38" cy="58" r="2.5" fill="#047857"/>
    <text x="37" y="98" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">Qdrant</text>
    <text x="37" y="114" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">Vector DB</text>
  </g>
</svg>
