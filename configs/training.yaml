# ============================================================
# Fruvia AI — Training Configuration
# ============================================================

version: "1.0"

# ---------- Reproducibility ----------
random_seed: 42

# ---------- Data Splits ----------
splits:
  train: 0.70
  validation: 0.15
  test: 0.15

# ---------- Image Preprocessing ----------
preprocessing:
  image_size: 224
  # ImageNet normalization (used by ConvNeXt and EfficientNet)
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

# ---------- Augmentation (train only) ----------
augmentation:
  random_horizontal_flip: true
  random_vertical_flip: false
  random_rotation_degrees: 15
  color_jitter:
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    hue: 0.05
  random_resized_crop:
    scale: [0.8, 1.0]
    ratio: [0.9, 1.1]
  random_erasing:
    probability: 0.1

# ---------- DataLoader ----------
dataloader:
  batch_size: 32
  num_workers: 4
  pin_memory: true
  prefetch_factor: 2

# ---------- EfficientNet-B0 Baseline ----------
efficientnet:
  model_name: efficientnet_b0
  pretrained: true
  freeze_backbone_epochs: 5
  total_epochs: 30
  learning_rate: 0.001
  fine_tune_learning_rate: 0.0001
  weight_decay: 0.01
  optimizer: adamw
  scheduler: cosine_annealing
  warmup_epochs: 2
  gradient_clip_max_norm: 1.0
  early_stopping_patience: 7
  use_class_weights: true
  mixed_precision: true
  label_smoothing: 0.1

# ---------- ConvNeXt-Tiny (primary) ----------
convnext:
  model_name: convnext_tiny
  pretrained: true
  freeze_backbone_epochs: 5
  total_epochs: 40
  learning_rate: 0.001
  fine_tune_learning_rate: 0.00005
  weight_decay: 0.01
  optimizer: adamw
  scheduler: cosine_annealing
  warmup_epochs: 3
  gradient_clip_max_norm: 1.0
  early_stopping_patience: 10
  use_class_weights: true
  mixed_precision: true
  label_smoothing: 0.1

# ---------- Evaluation ----------
evaluation:
  metrics:
    - accuracy
    - top3_accuracy
    - precision
    - recall
    - macro_f1
    - per_class_accuracy
    - confusion_matrix

# ---------- DINOv2 Embedding ----------
dinov2:
  model_name: facebook/dinov2-base
  vector_size: 768
  batch_size: 64
  mixed_precision: true
  l2_normalize: true

# ---------- Qdrant ----------
qdrant:
  collection_name: fruvia_fruits360_original_dinov2_base_v1
  distance: Cosine
  vector_size: 768
  dataset_version: fruits360-v1

# ---------- Minimum samples per class ----------
min_samples_per_class: 20
